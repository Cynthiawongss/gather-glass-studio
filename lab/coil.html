<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coil lab</title>
<style>html,body{height:100%;margin:0;background:#d3dbc6}canvas{width:100%;height:100%;display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// 实验：几百圈头发丝粗细的玻璃丝缠成一棵树。只为了调画面，不是产品代码。?mat=trans 换成透射材质对比
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createStrand, wobble } from '../src/coil.js';

const params = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe5d4);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
camera.position.set(0, 1.3, 7); camera.lookAt(0, 1.05, 0);
const sun = new THREE.DirectionalLight(0xfff6e8, 2); sun.position.set(3, 5, 4); scene.add(sun);
const table = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.1, 64), new THREE.MeshStandardMaterial({ color: 0xf3ecdf, roughness: 0.85 }));
table.position.y = -0.1; scene.add(table);

const clear = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 1, thickness: 0.2, ior: 1.5, roughness: 0.03, attenuationColor: new THREE.Color(0xe6f3ec), attenuationDistance: 2 });
const tree = new THREE.Group(); scene.add(tree);
const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.045, 2.5, 16), clear); stem.position.y = 1.25; tree.add(stem);
const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.5, 0.05, 48), clear); foot.position.y = 0.025; tree.add(foot);

const strand = createStrand(8000);
const palette = [new THREE.Color(0xf4fbf7), new THREE.Color(0x9fd8a4), new THREE.Color(0x4f9f5c)];
const pts = [];
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
// 四十几根丝，每根绕几圈，起止高度有重叠：先透明打底，再浅绿，最后几条深绿的粗带
for (let s = 0; s < 46; s++) {
  const c = s < 16 ? 0 : (s < 40 ? 1 : 2);
  const y0 = 0.35 + rnd() * 1.75, turns = 2.5 + rnd() * 4, rise = (rnd() - 0.35) * 0.5;
  const a0 = rnd() * 6.283, ph = rnd() * 100, base = c === 2 ? 0.02 + rnd() * 0.012 : 0.006 + rnd() * 0.008;
  const n = Math.floor(turns * 26);
  for (let i = 0; i <= n; i++) {
    const u = i / n, y = Math.min(Math.max(y0 + rise * u + 0.03 * wobble(ph + u * 9), 0.3), 2.3);
    const cone = 0.07 + 0.78 * Math.pow(1 - (y - 0.3) / 2.0, 1.25);
    pts.push({ a: a0 + u * turns * 6.283, r: Math.max(cone * (0.9 + 0.14 * wobble(ph * 2 + u * 14)) , 0.05), y, w: base * (0.75 + 0.4 * wobble(ph * 3 + u * 20)), c, b: i === 0 ? 1 : 0 });
  }
}
const alpha = new THREE.MeshPhysicalMaterial({ vertexColors: true, transparent: true, opacity: 0.62, roughness: 0.04, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.6, specularIntensity: 1, depthWrite: false, side: THREE.DoubleSide });
const trans = new THREE.MeshPhysicalMaterial({ vertexColors: true, transmission: 1, thickness: 0.05, ior: 1.5, roughness: 0.03, envMapIntensity: 1.4 });
tree.add(new THREE.Mesh(strand.geo, params.get('mat') === 'trans' ? trans : alpha));
strand.build(pts, palette);

const dotMat = new THREE.MeshPhysicalMaterial({ color: 0x8e1220, roughness: 0.15, clearcoat: 1 });
for (let i = 0; i < 14; i++) {
  const p = pts[Math.floor(rnd() * pts.length)];
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12), dotMat);
  m.position.set(Math.cos(p.a) * (p.r + 0.02), p.y, Math.sin(p.a) * (p.r + 0.02)); tree.add(m);
}
// 星星：五个角的小厚片
const sh = new THREE.Shape();
for (let i = 0; i < 10; i++) { const r = i % 2 ? 0.075 : 0.17, a = Math.PI / 2 + i * Math.PI / 5; sh[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); }
const star = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.05, bevelEnabled: true, bevelSize: 0.03, bevelThickness: 0.03, bevelSegments: 4 }), new THREE.MeshPhysicalMaterial({ color: 0xf2d24a, roughness: 0.25, clearcoat: 1 }));
star.position.set(0, 2.62, -0.04); tree.add(star);

function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
(function tick() { tree.rotation.y += 0.008; renderer.render(scene, camera); requestAnimationFrame(tick); })();
window.__pts = pts.length;
</script>
</body>
</html>
